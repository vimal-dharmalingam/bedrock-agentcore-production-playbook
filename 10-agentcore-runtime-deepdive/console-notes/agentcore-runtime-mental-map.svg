<svg width="680" height="880" viewBox="0 0 680 880" xmlns="http://www.w3.org/2000/svg" role="img">
<title>AgentCore Runtime mental map — 13 categories grouped into 4 branches around a central hub</title>
<desc>A radial mind map with AgentCore Runtime at the center and four branches: Core mechanics covering framework and model flexibility, session isolation, session lifecycle, invocation and streaming, and runtime environment; Protocols and auth covering async long-running work, MCP A2A and AG-UI protocols, and inbound outbound authentication; Production ops covering versioning and endpoints, IAM permissions, and observability; Security and infra covering security and pricing, and networking and VPC.</desc>

<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  .arr { stroke: #888780; stroke-width: 0.5; fill: none; }
  .box-purple { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
  .box-teal { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
  .box-coral { fill: #FAECE7; stroke: #993C1D; stroke-width: 0.5; }
  .box-amber { fill: #FAEEDA; stroke: #854F0B; stroke-width: 0.5; }
  .box-gray { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
  .t-purple { fill: #26215C; }
  .t-purple-s { fill: #3C3489; }
  .t-teal { fill: #04342C; }
  .t-teal-s { fill: #085041; }
  .t-coral { fill: #4A1B0C; }
  .t-coral-s { fill: #712B13; }
  .t-amber { fill: #412402; }
  .t-amber-s { fill: #633806; }
  .t-gray { fill: #2C2C2A; }
  .t-gray-s { fill: #444441; }
  svg { background: #ffffff; }
</style>

<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<line x1="340" y1="400" x2="340" y2="305" class="arr" marker-end="url(#arrow)"/>
<line x1="400" y1="460" x2="430" y2="460" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="520" x2="340" y2="650" class="arr" marker-end="url(#arrow)"/>
<line x1="280" y1="460" x2="250" y2="460" class="arr" marker-end="url(#arrow)"/>

<g>
<rect x="190" y="45" width="300" height="260" rx="6" class="box-purple"/>
<text x="210" y="78" class="th t-purple">Framework &amp; model</text>
<text x="210" y="94" class="ts t-purple-s">4-line SDK, any framework/model</text>
<text x="210" y="123" class="th t-purple">Session isolation</text>
<text x="210" y="139" class="ts t-purple-s">1 microVM per SESSION, not per agent</text>
<text x="210" y="168" class="th t-purple">Session lifecycle</text>
<text x="210" y="184" class="ts t-purple-s">15 min idle / 8 hr max, CPU free</text>
<text x="210" y="213" class="th t-purple">Invocation &amp; streaming</text>
<text x="210" y="229" class="ts t-purple-s">session ID = conversation key</text>
<text x="210" y="258" class="th t-purple">Runtime environment</text>
<text x="210" y="274" class="ts t-purple-s">env vars + filesystem = new version</text>
</g>

<g>
<rect x="430" y="365" width="210" height="190" rx="6" class="box-teal"/>
<text x="450" y="400" class="th t-teal">Async / long-running</text>
<text x="450" y="416" class="ts t-teal-s">ping status keeps it alive</text>
<text x="450" y="450" class="th t-teal">Protocols</text>
<text x="450" y="466" class="ts t-teal-s">HTTP + MCP + A2A + AG-UI</text>
<text x="450" y="500" class="th t-teal">Inbound / outbound auth</text>
<text x="450" y="516" class="ts t-teal-s">SigV4 or JWT, never both</text>
</g>

<g>
<rect x="190" y="650" width="300" height="190" rx="6" class="box-coral"/>
<text x="210" y="685" class="th t-coral">Versioning &amp; endpoints</text>
<text x="210" y="701" class="ts t-coral-s">DEFAULT moves, named pinned</text>
<text x="210" y="735" class="th t-coral">IAM permissions</text>
<text x="210" y="751" class="ts t-coral-s">execution role &#8800; workload identity</text>
<text x="210" y="785" class="th t-coral">Observability</text>
<text x="210" y="801" class="ts t-coral-s">CLI auto-instruments, rest manual</text>
</g>

<g>
<rect x="40" y="365" width="210" height="190" rx="6" class="box-amber"/>
<text x="60" y="410" class="th t-amber">Security &amp; pricing</text>
<text x="60" y="426" class="ts t-amber-s">CPU free, memory billed</text>
<text x="60" y="460" class="th t-amber">Networking &amp; VPC</text>
<text x="60" y="476" class="ts t-amber-s">VPC mode = outbound only</text>
</g>

<g>
<circle cx="340" cy="460" r="60" class="box-gray"/>
<text x="340" y="455" class="th t-gray" text-anchor="middle">AgentCore</text>
<text x="340" y="471" class="th t-gray" text-anchor="middle">Runtime</text>
<text x="340" y="486" class="ts t-gray-s" text-anchor="middle">13 categories</text>
</g>
</svg>
