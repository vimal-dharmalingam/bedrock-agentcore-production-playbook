# Reference only -- don't `kubectl apply` this file directly. `eksctl create iamserviceaccount`
# (see README step 4) creates BOTH the IAM role (trust policy scoped to exactly this
# name+namespace via the cluster's OIDC provider) AND this ServiceAccount object, with the
# annotation already filled in, in one command. This file just documents what that command
# produces, so the shape isn't a black box.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: calc-agent-sa
  namespace: default
  annotations:
    # Filled in automatically by `eksctl create iamserviceaccount`. This is the whole trick:
    # the annotation is what tells the EKS Pod Identity webhook which IAM role to hand
    # temporary credentials for, to any pod that sets serviceAccountName: calc-agent-sa.
    eks.amazonaws.com/role-arn: "arn:aws:iam::<ACCOUNT_ID>:role/calc-agent-eks-bedrock-role"
