AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Calculator agent as a plain Lambda function, deployed via raw hand-written CloudFormation.
  CloudFormation cannot package or upload code any more than it could build a Docker image in
  01-agentcore-runtime/cloudformation -- the zip must already sit in S3 (see upload_code.py)
  before this template ever runs.

Parameters:
  CodeS3Bucket:
    Type: String
    Description: S3 bucket holding the built deployment_package.zip (see upload_code.py output)
  CodeS3Key:
    Type: String
    Default: lambda-cloudformation/deployment_package.zip
  FunctionName:
    Type: String
    Default: calc_agent_lambda_cfn

Resources:
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      # Deliberately named to match the already-granted "role/CalcAgentLambda*" wildcard from
      # 03-classic-bedrock-agent-lambda's IAM policy -- same trick used in cdk/ and terraform/.
      RoleName: CalcAgentLambdaCfnExecutionRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole

  ExecutionPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: CfnLambdaExecutionPolicy
      Roles:
        - !Ref ExecutionRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaBasicExecution
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${FunctionName}*"
          - Sid: BedrockModelInvocation
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource:
              - "arn:aws:bedrock:*::foundation-model/*"
              - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:*"

  CalcAgentFunction:
    Type: AWS::Lambda::Function
    DependsOn: ExecutionPolicy
    Properties:
      FunctionName: !Ref FunctionName
      Runtime: python3.13
      Handler: lambda_function.lambda_handler
      Role: !GetAtt ExecutionRole.Arn
      Architectures:
        - x86_64
      Timeout: 30
      MemorySize: 512
      Code:
        S3Bucket: !Ref CodeS3Bucket
        S3Key: !Ref CodeS3Key

Outputs:
  FunctionArn:
    Value: !GetAtt CalcAgentFunction.Arn
  FunctionName:
    Value: !Ref CalcAgentFunction
