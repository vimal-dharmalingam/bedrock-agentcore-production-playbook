name: Deploy AgentCore Agent (boto3-direct)

# CI stage: checkout + install deps (no AWS calls yet).
# CD stage: OIDC-assume an AWS role, then run the exact same deploy_my_agent.py you'd run by
# hand -- the starter toolkit's Runtime.launch() builds the image (via CodeBuild, no local
# Docker needed), pushes to ECR, and creates/updates the AgentCore Runtime agent in one call.
on:
  push:
    branches: [main]
    paths:
      - "01-agentcore-runtime/boto3-direct/**"
      - ".github/workflows/deploy-agentcore.yml"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

permissions:
  id-token: write   # required for OIDC -- this is what lets AWS trust the GitHub-issued token
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 01-agentcore-runtime/boto3-direct
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # TEMPORARY diagnostic step -- prints the actual OIDC token claims GitHub issues, so they
      # can be compared character-for-character against the IAM role's trust policy condition.
      # Remove once the real mismatch is found and fixed.
      - name: Debug OIDC token claims
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          IDTOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys, json; print(json.load(sys.stdin)['value'])")
          python3 -c "
          import base64, json
          token = '''$IDTOKEN'''
          payload = token.split('.')[1]
          padded = payload + '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(padded))
          print(json.dumps({k: claims.get(k) for k in ('aud', 'sub', 'repository', 'repository_owner', 'ref', 'event_name')}, indent=2))
          "

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Deploy agent
        id: deploy
        run: python deploy_my_agent.py

      - name: Smoke test invoke
        env:
          AGENT_ARN: ${{ steps.deploy.outputs.agent_arn }}
        run: |
          python -c "
          from invoke_agent import invoke_agent
          import os
          result, _ = invoke_agent(os.environ['AGENT_ARN'], 'What is 25 * 4?')
          print('Smoke test response:', result)
          assert result is not None, 'Agent did not return a response'
          "
